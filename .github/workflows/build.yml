name: Build VPK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vita-bootinstaller/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and package bootinstaller
      working-directory: vita-bootinstaller
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake
        make -j$(nproc)
        cmake --install . --prefix="$(pwd)/out"
        vita-makepkg -s -f out/

    - name: Upload VPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: bootinstaller-vpk
        path: vita-bootinstaller/build/out/*.vpk
        compression-level: 0
